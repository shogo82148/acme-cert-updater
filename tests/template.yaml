AWSTemplateFormatVersion: 2010-09-09
Description: test environment for acme-cert-updater

Resources:
  UpdateTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: acme-cert-updater-test

  TestBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: shogo82148-acme-cert-updater-test

  TestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action:
              - "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": "repo:shogo82148@1157344/acme-cert-updater@168665807:ref:refs/heads/*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
      Policies:
        - PolicyName: sns
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "sns:Publish"
                Resource:
                  - !Ref UpdateTopic
        - PolicyName: s3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "s3:*"
                Resource:
                  - !GetAtt TestBucket.Arn
                  - !Sub "${TestBucket.Arn}/*"
        - PolicyName: route53
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "route53:ListHostedZones"
                  - "route53:GetChange"
                Resource:
                  - "*"
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                Resource:
                  - arn:aws:route53:::hostedzone/Z1TR8BQNS8S1I7
        - PolicyName: sam-validation
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "cloudformation:ValidateTemplate"
                Resource:
                  - "*"
              - Effect: Allow
                Action:
                  - iam:ListPolicies
                Resource:
                  - "*"

Outputs:
  Role:
    Value: !Ref TestRole
