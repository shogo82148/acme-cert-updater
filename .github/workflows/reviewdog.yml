name: reviewdog
on: [pull_request]

jobs:
  actions-cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-cfn-lint@97dba6ef318c6ad72a642bee8b332951c90c800d # v4.82.1
        with:
          reporter: github-pr-review
          level: warning
          cfn_lint_args: "**/*.yaml"
