name: reviewdog
on: [pull_request]

jobs:
  actions-cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shogo82148/actions-cfn-lint@v4.83.1
        with:
          reporter: github-pr-review
          level: warning
          cfn_lint_args: "**/*.yaml"
