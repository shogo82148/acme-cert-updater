name: reviewdog
on: [pull_request]

jobs:
  actions-cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-cfn-lint@37e00c0c28690d60bf0e34f63ce58914e2b93cf8 # v4.80.1
        with:
          reporter: github-pr-review
          level: warning
          cfn_lint_args: "**/*.yaml"
